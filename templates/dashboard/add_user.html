{%extends 'base.html'%}
{%block content%}
{% load crispy_forms_tags %}
<div class="row">
    <!-- Left sidebar -->
     <!-- Load the sidebar here -->
    {% include 'dashboard/sidebar.html' %}
     <!-- Right sidebar -->
        <div class="col-md-9">
            {% if perms.auth.add_user %}
            <h3>Add new User</h2>
                <!-- if file field is created must create enctype -->
            <form action="{% url 'add_user' %}" method="POST" >
                {% csrf_token %}
                {{ form | crispy}}
                <button type="submit" class="btn btn-warning">Submit</button>
            </form>
            <br>
            {%else%}
            <h5><i>You Donot have the permission to add</i></h5>
            {% endif %}
      </div>
</div>
{%endblock%}
